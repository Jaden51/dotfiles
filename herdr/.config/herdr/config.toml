onboarding = false

[ui.toast]
delivery = "terminal"

[keys]
prefix = "ctrl+w"
rename_tab = "prefix+shift+c"
new_tab = "prefix+t"

[ui]
sidebar_width = 40
sidebar_min_width = 40
sidebar_max_width = 40

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[theme]
name = "rose-pine-dawn"
auto_switch = false
